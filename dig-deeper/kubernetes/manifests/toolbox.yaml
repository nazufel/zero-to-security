# A pod with a shell, for testing from inside the cluster. Label it role=client
# (or not) to test network policies.
apiVersion: v1
kind: Pod
metadata:
  name: toolbox
  namespace: logslayer
  labels:
    role: client
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: cgr.dev/chainguard/wolfi-base:latest
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        limits:
          cpu: 100m
          memory: 64Mi
